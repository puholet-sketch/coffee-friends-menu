<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeFriends — меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/menu.css?v=20261019-cat-gif">
</head>
<body>
  <div class="board" id="board">
    <button
      type="button"
      class="orient-btn"
      id="orientBtn"
      aria-label="Поворот экрана"
      title="Поворот для вертикального монитора"
    >⟳</button>
    <div class="board__frame" id="frame">
      <!-- slides injected by JS -->
    </div>
    <div class="board__progress">
      <div class="board__progress-bar" id="progress"></div>
    </div>
  </div>

  <script>
    const ASSET_VER = '20261019-cat-gif';
    const PROMO_EVERY_N_CARDS = 2;
    const POEM_CLASSIC_DURATION_SEC = 22;
    const POEM_CF_DURATION_SEC = 5.25;
    const CAT_SLIDE_DURATION_SEC = 3.5;
    const PROMO_PCT_CYCLE_MS = 900;
    const CAT_GIF_SRC = `assets/images/cat/barista-spin.gif?v=${ASSET_VER}`;
    const TG_BOT_URL = 'https://t.me/coffeefriends_orders_bot';
    const TG_BOT_HANDLE = '@coffeefriends_orders_bot';
    /* Document-relative — never put url() in CSS custom props used by menu.css */
    const TG_QR_SRC = `assets/images/order/bot-qr.png?v=${ASSET_VER}`;

    /* DeepSeek-style canvas tetris on a square cell grid, then real QR fades in */
    const TG_QR_ROWS = 10;
    const TG_QR_COLS = 10;
    const TG_QR_SPEED = 7; /* cells per second */
    const TG_QR_STAGGER_MS = 500;
    const TG_QR_DROP_FROM = 4;
    const TG_QR_BOUNCE_MS = 300;
    const TG_QR_HOLD_AFTER_SEC = 5.5;
    const TG_QR_SHAPES = [
      [[0, 0], [0, 1], [0, 2], [1, 2]],
      [[0, 7], [0, 8], [0, 9], [1, 7]],
      [[1, 0], [2, 0], [2, 1], [2, 2]],
      [[1, 9], [2, 7], [2, 8], [2, 9]],
      [[3, 3], [3, 4], [3, 5], [3, 6]],
      [[4, 1], [5, 0], [5, 1], [5, 2]],
      [[5, 7], [5, 8], [6, 7], [6, 8]],
      [[7, 0], [7, 1], [7, 2], [8, 0]],
      [[7, 6], [7, 7], [8, 7], [8, 8]],
      [[8, 2], [9, 0], [9, 1], [9, 2]]
    ];
    const TG_ORDER_DURATION_SEC = (() => {
      let maxEnd = 0;
      TG_QR_SHAPES.forEach((cells, i) => {
        const maxRow = Math.max(...cells.map((c) => c[0]));
        const dist = maxRow + TG_QR_DROP_FROM;
        const duration = (dist / TG_QR_SPEED) * 1000;
        maxEnd = Math.max(maxEnd, i * TG_QR_STAGGER_MS + duration + TG_QR_BOUNCE_MS);
      });
      return maxEnd / 1000 + 0.45 + TG_QR_HOLD_AFTER_SEC;
    })();

    let promoPctRaf = null;
    let tgQrRaf = null;
    let tgQrRevealTimer = null;

    function stopPromoPctBoom() {
      if (promoPctRaf != null) {
        cancelAnimationFrame(promoPctRaf);
        promoPctRaf = null;
      }
      document.querySelectorAll('.promo__pct').forEach((el) => {
        el.classList.remove('promo__pct--js');
        el.style.transform = '';
        el.style.filter = '';
        el.style.textShadow = '';
        const ghost = el.querySelector('.promo__pct-ghost');
        if (ghost) {
          ghost.style.opacity = '0';
          ghost.style.transform = '';
        }
      });
    }

    function isBoomSlide(slide) {
      return (
        slide &&
        (slide.classList.contains('slide--promo') ||
          slide.classList.contains('slide--tg'))
      );
    }

    /** JS boom-boom — ignores OS prefers-reduced-motion (common on Windows TV/Edge). */
    function startPromoPctBoom(slide) {
      stopPromoPctBoom();
      if (!isBoomSlide(slide)) return;
      const el = slide.querySelector('.promo__pct');
      if (!el) return;

      el.classList.add('promo__pct--js');
      const boomLabel =
        el.dataset.boomText ||
        Array.from(el.childNodes)
          .filter((n) => n.nodeType === Node.TEXT_NODE)
          .map((n) => n.textContent.trim())
          .join('')
          .trim() ||
        el.textContent.replace(/\s+/g, ' ').trim() ||
        '20%';
      // Ensure ghost ring node exists for JS opacity/scale
      let ghost = el.querySelector('.promo__pct-ghost');
      if (!ghost) {
        ghost = document.createElement('span');
        ghost.className = 'promo__pct-ghost';
        ghost.setAttribute('aria-hidden', 'true');
        el.appendChild(ghost);
      }
      ghost.textContent = boomLabel;
      el._ghostEl = ghost;

      const t0 = performance.now();

      function beat(p) {
        // Double punch in one cycle: ~12% and ~38%
        let scale = 1;
        let glow = 0;
        let ghostOp = 0;
        let ghostScale = 1;
        if (p < 0.12) {
          const u = p / 0.12;
          const s = Math.sin(u * Math.PI);
          scale = 1 + 0.16 * s;
          glow = s;
          ghostOp = 0.9 * s;
          ghostScale = 1 + 0.28 * s;
        } else if (p < 0.22) {
          const u = (p - 0.12) / 0.1;
          scale = 1.16 - 0.23 * u;
          glow = 1 - u;
          ghostOp = (1 - u) * 0.5;
          ghostScale = 1.28 + 0.22 * u;
        } else if (p < 0.38) {
          const u = (p - 0.22) / 0.16;
          const s = Math.sin(u * Math.PI);
          scale = 0.93 + 0.19 * s;
          glow = 0.85 * s;
          ghostOp = 0.75 * s;
          ghostScale = 1 + 0.22 * s;
        } else if (p < 0.5) {
          const u = (p - 0.38) / 0.12;
          scale = 1;
          glow = 0.15 * (1 - u);
          ghostOp = 0;
          ghostScale = 1.2;
        }
        return { scale, glow, ghostOp, ghostScale };
      }

      function tick(now) {
        if (!slide.classList.contains('slide--active')) {
          stopPromoPctBoom();
          return;
        }
        const p = ((now - t0) % PROMO_PCT_CYCLE_MS) / PROMO_PCT_CYCLE_MS;
        const { scale, glow, ghostOp, ghostScale } = beat(p);
        el.style.transform = `scale(${scale.toFixed(4)})`;
        el.style.filter = `brightness(${(1 + glow * 0.22).toFixed(3)})`;
        el.style.textShadow =
          glow > 0.04
            ? `0 0 ${(4 + glow * 14).toFixed(1)}px rgba(255,255,255,${(0.5 + glow * 0.45).toFixed(2)}),` +
              `0 0 ${(12 + glow * 22).toFixed(1)}px rgba(192,0,0,${(0.35 + glow * 0.5).toFixed(2)}),` +
              `0 0 ${(28 + glow * 24).toFixed(1)}px rgba(251,90,90,${(glow * 0.55).toFixed(2)})`
            : 'none';
        ghost.style.opacity = String(ghostOp.toFixed(3));
        ghost.style.transform = `scale(${ghostScale.toFixed(4)})`;
        promoPctRaf = requestAnimationFrame(tick);
      }

      promoPctRaf = requestAnimationFrame(tick);
    }
    const MENU_DISCOUNT_PERCENT = 0; // paused — restore later; combos use item.discountPercent
    const PRELOAD_RADIUS = 2;
    const ROTATE_KEY = 'cf-menu-rotate';
    const ROTATE_MODES = ['off', 'cw', 'ccw'];

    const TAG_LABELS = {
      cold: 'холодный',
      hot: 'горячий',
      signature: 'авторский',
      matcha: 'матча',
      seasonal: 'сезонный',
      dessert: 'десерт',
      sweet: 'сладкое',
      sandwich: 'сэндвич',
      food: 'еда',
      preorder: 'предзаказ',
      combo: 'комбо'
    };

    function brandHtml(brand) {
      const parts = (brand.name || 'CoffeeFriends').match(/^(.+?)(Friends)$/i);
      if (parts) {
        return `${parts[1]}<span class="gold">${parts[2]}</span>`;
      }
      return brand.name;
    }

    async function loadMenuData() {
      if (location.protocol === 'file:') {
        throw new Error('Открыт файл напрямую (file://). Браузер блокирует fetch JSON.\nНужен http://localhost:8080/board.html');
      }
      let drinksRes, foodRes, poemsRes;
      try {
        [drinksRes, foodRes, poemsRes] = await Promise.all([
          fetch('data/drinks.json'),
          fetch('data/food.json'),
          fetch('data/poems.json')
        ]);
      } catch (e) {
        throw new Error('Failed to fetch — сервер не отвечает или открыт не тот URL.\nПроверьте: http://localhost:8080/board.html');
      }
      if (!drinksRes.ok) throw new Error('Не найден data/drinks.json — запустите сервер из папки menu');
      const drinks = await drinksRes.json();
      const food = foodRes.ok ? await foodRes.json() : { categories: [] };
      const poems = poemsRes.ok
        ? await poemsRes.json()
        : { classic: [], coffeeFriends: [] };
      return { drinks, food, poems };
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function createPoemSlide(poem, brand, { eyebrow, variant = 'classic', badge = 'Стих' } = {}) {
      const slide = document.createElement('article');
      const isCf = variant === 'cf';
      slide.className = isCf ? 'slide slide--poem slide--poem-cf' : 'slide slide--poem';
      slide.dataset.poemKind = isCf ? 'cf' : 'classic';
      const lines = (poem.lines || []).map((line) => `<p>${escapeHtml(line)}</p>`).join('');
      slide.innerHTML = `
        <div class="poem-card">
          <header class="slide__header poem-card__head">
            <div class="brand-mark">
              <span class="brand-mark__icon" aria-hidden="true"></span>
              <span class="brand-mark__text">${brandHtml(brand)}</span>
            </div>
            <span class="category-badge">${escapeHtml(badge)}</span>
          </header>
          <div class="poem-card__body">
            <div class="promo__mark" aria-hidden="true"></div>
            <p class="poem__eyebrow">${escapeHtml(eyebrow || (isCf ? 'CoffeeFriends' : 'Осень'))}</p>
            <blockquote class="poem__text">${lines}</blockquote>
            <p class="poem__author">— ${escapeHtml(poem.author || '')}</p>
          </div>
        </div>
      `;
      return slide;
    }

    function createIntroSlide(brand) {
      const slide = document.createElement('article');
      slide.className = 'slide slide--intro';
      slide.innerHTML = `
        <div class="intro__mark" aria-hidden="true"></div>
        <h1 class="intro__title">${brandHtml(brand)}</h1>
        <p class="intro__tagline">${brand.tagline || ''}</p>
        <div class="intro__line" aria-hidden="true"></div>
      `;
      return slide;
    }

    function leafFieldHtml(count = 12) {
      return Array.from({ length: count }, (_, i) => {
        const tone = (i % 4) + 1;
        const delay = ((i * 0.55) % 4.8).toFixed(2);
        const duration = (6.5 + (i % 4) * 1.2).toFixed(1);
        const left = (6 + (i * 7.5) % 88).toFixed(1);
        const drift = ((i % 2 === 0 ? 1 : -1) * (20 + (i % 4) * 14)).toFixed(0);
        const size = (15 + (i % 4) * 4).toFixed(0);
        const spin = (i % 2 === 0 ? 1 : -1) * (300 + i * 35);
        return `<i class="leaf leaf--${tone}" style="left:${left}%;--d:${delay}s;--t:${duration}s;--x:${drift}px;--s:${size}px;--r:${spin}deg" aria-hidden="true"></i>`;
      }).join('');
    }

    function createPersonalDiscountSlide(brand) {
      const slide = document.createElement('article');
      slide.className = 'slide slide--promo';

      slide.innerHTML = `
        <div class="promo-fx" aria-hidden="true">${leafFieldHtml(12)}</div>
        <div class="promo-card">
          <header class="slide__header promo-card__head">
            <div class="brand-mark">
              <span class="brand-mark__icon" aria-hidden="true"></span>
              <span class="brand-mark__text">${brandHtml(brand)}</span>
            </div>
            <span class="category-badge">Осень</span>
          </header>
          <div class="promo-card__body">
            <div class="promo__mark" aria-hidden="true"></div>
            <p class="promo__eyebrow">Всю осень</p>
            <h2 class="promo__title">Скидосы всю осень!</h2>
            <p class="promo__offer"><span class="promo__pct" data-boom-text="20%">20%</span> на комбо</p>
            <p class="promo__lead">Подробности у бариста</p>
          </div>
        </div>
      `;
      return slide;
    }

    function buildTgQrBoardHtml() {
      return `
        <div
          class="tg-qr-board"
          data-tg-qr-board
          role="img"
          aria-label="QR-код бота ${TG_BOT_HANDLE}"
        >
          <canvas class="tg-qr-canvas" data-tg-qr-canvas aria-hidden="true"></canvas>
          <img
            class="tg-qr-final"
            data-tg-qr-final
            alt=""
            decoding="async"
            draggable="false"
          />
        </div>`;
    }

    function stopTgQrLoop() {
      if (tgQrRaf != null) {
        cancelAnimationFrame(tgQrRaf);
        tgQrRaf = null;
      }
      if (tgQrRevealTimer != null) {
        clearTimeout(tgQrRevealTimer);
        tgQrRevealTimer = null;
      }
    }

    function tgQrRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function sizeTgQrCanvas(board, canvas) {
      const cssSize = Math.max(120, Math.floor(board.clientWidth || board.offsetWidth || 280));
      const pad = Math.max(8, Math.round(cssSize * 0.06));
      const cell = (cssSize - pad * 2) / TG_QR_COLS;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cssSize * dpr);
      canvas.height = Math.round(cssSize * dpr);
      canvas.style.width = cssSize + 'px';
      canvas.style.height = cssSize + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, size: cssSize, pad, cell };
    }

    function buildTgQrPieces() {
      return TG_QR_SHAPES.map((cells, i) => {
        const maxRow = Math.max(...cells.map((c) => c[0]));
        const dist = maxRow + TG_QR_DROP_FROM;
        return {
          cells,
          start: i * TG_QR_STAGGER_MS,
          duration: (dist / TG_QR_SPEED) * 1000,
          dyStart: -dist
        };
      });
    }

    function drawTgQrBackdrop(ctx, size, pad, cell) {
      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = '#f1f1f1';
      ctx.lineWidth = 1;
      for (let i = 1; i < TG_QR_COLS; i += 1) {
        const x = Math.round(pad + i * cell) + 0.5;
        ctx.beginPath();
        ctx.moveTo(x, pad);
        ctx.lineTo(x, pad + TG_QR_ROWS * cell);
        ctx.stroke();
      }
      for (let j = 1; j < TG_QR_ROWS; j += 1) {
        const y = Math.round(pad + j * cell) + 0.5;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(pad + TG_QR_COLS * cell, y);
        ctx.stroke();
      }
    }

    function drawTgQrPiece(ctx, pad, cell, piece, dy, pop, flying) {
      ctx.save();
      if (flying) ctx.globalAlpha = 0.82;
      ctx.fillStyle = '#111111';
      const gap = Math.max(1.2, cell * 0.045);
      for (const [r, c] of piece.cells) {
        const cx = pad + c * cell + cell / 2;
        const cy = pad + (r + dy) * cell + cell / 2;
        const s = (cell - gap * 2) * (1 + pop);
        const rad = Math.min(5, s * 0.18);
        tgQrRoundRect(ctx, cx - s / 2, cy - s / 2, s, s, rad);
        ctx.fill();
      }
      ctx.restore();
    }

    function resetTgQrAssemble(slide) {
      stopTgQrLoop();
      if (!slide) return;
      const board = slide.querySelector('[data-tg-qr-board]');
      if (!board) return;
      board.classList.remove('tg-qr-board--assembling', 'tg-qr-board--done');
      const finalImg = board.querySelector('[data-tg-qr-final]');
      if (finalImg) {
        finalImg.classList.remove('tg-qr-final--show');
        finalImg.style.opacity = '0';
      }
      const canvas = board.querySelector('[data-tg-qr-canvas]');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.style.opacity = '1';
      }
    }

    function startTgQrAssemble(slide) {
      stopTgQrLoop();
      document.querySelectorAll('.slide--tg').forEach((s) => {
        if (s !== slide) resetTgQrAssemble(s);
      });
      if (!slide || !slide.classList.contains('slide--tg')) return;

      const board = slide.querySelector('[data-tg-qr-board]');
      const canvas = board && board.querySelector('[data-tg-qr-canvas]');
      const finalImg = board && board.querySelector('[data-tg-qr-final]');
      if (!board || !canvas) return;

      if (finalImg) {
        if (finalImg.getAttribute('src') !== TG_QR_SRC) finalImg.src = TG_QR_SRC;
        finalImg.classList.remove('tg-qr-final--show');
        finalImg.style.opacity = '0';
      }
      canvas.style.opacity = '1';
      board.classList.remove('tg-qr-board--done');
      board.classList.add('tg-qr-board--assembling');

      /* Size after paint so the active slide has real box metrics. */
      requestAnimationFrame(() => {
        if (!slide.classList.contains('slide--active')) return;
        const geo = sizeTgQrCanvas(board, canvas);
        if (geo.size < 80) {
          /* Retry once if layout not ready */
          requestAnimationFrame(() => {
            if (slide.classList.contains('slide--active')) startTgQrAssemble(slide);
          });
          return;
        }

        const pieces = buildTgQrPieces();
        let t0 = 0;
        let finished = false;

        function revealQr() {
          if (!slide.classList.contains('slide--active')) return;
          board.classList.add('tg-qr-board--done');
          canvas.style.opacity = '0';
          if (finalImg) {
            finalImg.classList.add('tg-qr-final--show');
            finalImg.style.opacity = '1';
          }
          if (tgQrRaf != null) {
            cancelAnimationFrame(tgQrRaf);
            tgQrRaf = null;
          }
        }

        function render(now) {
          if (!slide.classList.contains('slide--active')) {
            stopTgQrLoop();
            return;
          }
          if (!t0) t0 = now;
          const t = now - t0;
          const { ctx, size, pad, cell } = geo;

          drawTgQrBackdrop(ctx, size, pad, cell);

          let landed = 0;
          for (const p of pieces) {
            const local = t - p.start;
            if (local <= 0) continue;
            let prog = local / p.duration;
            if (prog >= 1) {
              prog = 1;
              landed += 1;
            }
            const tp = Math.pow(prog, 1.55);
            const dy = p.dyStart * (1 - tp);
            let pop = 0;
            if (prog === 1) {
              const since = local - p.duration;
              if (since < TG_QR_BOUNCE_MS) {
                pop = 0.14 * Math.sin((since / TG_QR_BOUNCE_MS) * Math.PI);
              }
            }
            drawTgQrPiece(ctx, pad, cell, p, dy, pop, prog < 1);
          }

          if (!finished && landed === pieces.length) {
            finished = true;
            tgQrRevealTimer = setTimeout(revealQr, TG_QR_BOUNCE_MS + 120);
          }

          tgQrRaf = requestAnimationFrame(render);
        }

        tgQrRaf = requestAnimationFrame(render);
      });
    }

    function createTelegramOrderSlide(brand) {
      const slide = document.createElement('article');
      slide.className = 'slide slide--promo slide--tg';

      slide.innerHTML = `
        <div class="promo-fx" aria-hidden="true">${leafFieldHtml(10)}</div>
        <div class="promo-card tg-card">
          <header class="slide__header promo-card__head">
            <div class="brand-mark">
              <span class="brand-mark__icon" aria-hidden="true"></span>
              <span class="brand-mark__text">${brandHtml(brand)}</span>
            </div>
            <span class="category-badge">Заказ</span>
          </header>
          <div class="promo-card__body tg-card__body">
            <p class="promo__eyebrow">Онлайн-заказ</p>
            <h2 class="promo__title tg-card__title">
              Заказ в <span class="promo__pct" data-boom-text="Telegram">Telegram</span>
            </h2>
            <p class="tg-card__handle">${escapeHtml(TG_BOT_HANDLE)}</p>
            <div class="tg-card__qr-wrap">
              ${buildTgQrBoardHtml()}
            </div>
            <p class="promo__lead tg-card__lead">Наведите камеру — откроется бот</p>
            <p class="tg-card__hint">Заказ сейчас или предзаказ · этаж 2 / 11 · оплата у стойки</p>
          </div>
        </div>
      `;

      const finalImg = slide.querySelector('[data-tg-qr-final]');
      if (finalImg) finalImg.src = TG_QR_SRC;
      return slide;
    }

    function createCatSlide(brand) {
      const slide = document.createElement('article');
      slide.className = 'slide slide--cat';
      slide.innerHTML = `
        <div class="cat-card">
          <header class="slide__header cat-card__head">
            <div class="brand-mark">
              <span class="brand-mark__icon" aria-hidden="true"></span>
              <span class="brand-mark__text">${brandHtml(brand)}</span>
            </div>
            <span class="category-badge">Мяу</span>
          </header>
          <div class="cat-card__body">
            <p class="cat-card__eyebrow">Друг за стойкой</p>
            <div class="cat-card__gif">
              <img
                src="${CAT_GIF_SRC}"
                alt="Рыжий полосатый кот крутит латте"
                width="540"
                height="720"
                decoding="async"
                draggable="false"
              />
            </div>
            <h2 class="cat-card__title">Рыжий бариста</h2>
            <p class="cat-card__lead">Крутит латте. Крадёт сливки. Работает.</p>
          </div>
        </div>
      `;
      return slide;
    }

    window.startTgQrAssemble = startTgQrAssemble;
    window.resetTgQrAssemble = resetTgQrAssemble;

    function syncPromoFallDistance(slide) {
      if (!isBoomSlide(slide)) return;
      const h = Math.max(slide.clientHeight || 0, 640);
      slide.style.setProperty('--fall', `${h + 80}px`);
    }

    function formatMeta(item, opts = {}) {
      const volume = (item.volume || '').trim();
      const price = (item.price || '').trim();
      const volumeOnlyPrice = /^(от\s+)?\d[\d\s]*\s*₽$/i.test(volume);
      const discountPercent = opts.discountPercent || null;

      function formatPriceText(priceText) {
        return priceText.replace(/^от\s+/i, '<span class="slide__price-prefix">от</span> ');
      }

      let html = '';

      function renderPrice(priceText) {
        if (!discountPercent) {
          return `<p class="slide__price">${formatPriceText(priceText)}</p>`;
        }

        return `
          <div class="slide__priceBox">
            <span class="slide__priceWrap">
              <p class="slide__price slide__price--old">${formatPriceText(priceText)}</p>
              <span class="slide__strike" aria-hidden="true"></span>
            </span>
            <span class="slide__discount">${discountPercent}% скидка</span>
          </div>
        `;
      }

      // Volume with size tiers is too noisy for storefront slides:
      // keep only the minimal gold price and hide the per-size list.
      if (volume && /₽/.test(volume) && !volumeOnlyPrice) {
        if (price) html += renderPrice(price);
        return html;
      }

      // Plain volume (350 мл / порция) + gold price
      if (volume && !volumeOnlyPrice) {
        html += `<p class="slide__volume">${volume}</p>`;
      }
      if (price) {
        html += renderPrice(price);
      } else if (volumeOnlyPrice && volume) {
        html += renderPrice(volume);
      }
      return html;
    }

    function placeholderHtml(kind) {
      if (kind === 'food') {
        return '<div class="slide__photo--placeholder placeholder-plate" aria-hidden="true"></div>';
      }
      return `
        <div class="slide__photo--placeholder placeholder-cup" aria-hidden="true">
          <div class="placeholder-cup__lid"></div>
          <div class="placeholder-cup__body"></div>
        </div>`;
    }

    function accentClassFor(item, categoryTitle, kind = 'drink') {
      const id = String(item.id || '').toLowerCase();
      const name = String(item.name || '').toLowerCase();
      const desc = String(item.description || '').toLowerCase();
      const tags = Array.isArray(item.tags) ? item.tags.map(String) : [];
      const text = `${id} ${name} ${desc} ${categoryTitle || ''}`.toLowerCase();

      if (kind === 'food') {
        if (/салат|salat|овощ|broccoli|chiabatta|sendvich|roll|ролл/.test(text)) return 'accent-fresh';
        if (/круас|печенье|батончик|сочник|трубоч|ириск|орех/.test(text)) return 'accent-bakery';
        return 'accent-warm';
      }

      if (tags.includes('matcha') || /matcha|матча/.test(text)) return 'accent-matcha';
      if (/лимонад|апельсин|orange|fresh|фреш|tonik|тоник|citrus|lemon/.test(text)) return 'accent-citrus';
      if (/клубник|малин|ягод|pink|red/.test(text)) return 'accent-berry';
      if (/айс|cold|iced|глясе|frappuccino|милкшейк|лед|ice/.test(text) || tags.includes('cold')) return 'accent-ice';
      if (/шоколад|мокко|какао|cocoa|mocha/.test(text)) return 'accent-cocoa';
      if (/раф|капуч|латте|эспрессо|americano|coffee|кофе/.test(text) || tags.includes('hot')) return 'accent-coffee';
      return 'accent-warm';
    }

    function isNewItem(item) {
      return item.new === true;
    }

    function newBadgeHtml(variant = 'inline') {
      const cls = variant === 'flag' ? 'slide__newFlag' : 'slide__new';
      return `<span class="${cls}"><span>Новинка!</span></span>`;
    }

    function createItemSlide(item, categoryTitle, brand, kind = 'drink') {
      const slide = document.createElement('article');
      slide.className = 'slide';

      const discountPercent = Number.isFinite(Number(item.discountPercent)) && Number(item.discountPercent) > 0
        ? Number(item.discountPercent)
        : (MENU_DISCOUNT_PERCENT > 0 && kind !== 'food' ? MENU_DISCOUNT_PERCENT : null);
      const isNew = isNewItem(item);

      const tagsHtml = (item.tags || [])
        .map(t => `<span class="tag">${TAG_LABELS[t] || t}</span>`)
        .join('');

      const safeName = String(item.name || '').replace(/"/g, '&quot;');
      const accentClass = accentClassFor(item, categoryTitle, kind);
      const photoNewClass = isNew ? ' slide__photo--hasNew' : '';

      slide.innerHTML = `
        <header class="slide__header">
          <div class="brand-mark">
            <span class="brand-mark__icon" aria-hidden="true"></span>
            <span class="brand-mark__text">${brandHtml(brand)}</span>
          </div>
          <span class="category-badge">${categoryTitle}</span>
        </header>
        <div class="slide__photo ${accentClass}${photoNewClass}" data-image="${item.image}" data-alt="${safeName}">
          ${isNew ? newBadgeHtml('flag') : ''}
          ${placeholderHtml(kind)}
        </div>
        <div class="slide__info">
          <h2 class="slide__name">${item.name}</h2>
          <div class="slide__meta">
            <div class="slide__promoRow">
              ${isNew ? newBadgeHtml('inline') : ''}
              ${formatMeta(item, { discountPercent })}
            </div>
          </div>
          <p class="slide__desc">${item.description || ''}</p>
          ${tagsHtml ? `<div class="slide__tags">${tagsHtml}</div>` : ''}
        </div>
      `;

      return slide;
    }

    function loadSlideImage(slide) {
      const photoWrap = slide && slide.querySelector('.slide__photo');
      if (!photoWrap || photoWrap.dataset.loaded === '1' || !photoWrap.dataset.image) return;

      photoWrap.dataset.loaded = '1';
      const img = new Image();
      img.alt = photoWrap.dataset.alt || '';
      img.decoding = 'async';
      img.onload = () => {
        photoWrap.innerHTML = '';
        photoWrap.appendChild(img);
      };
      img.onerror = () => {
        photoWrap.dataset.loaded = '0';
        photoWrap.classList.add('slide__photo--placeholder');
      };
      img.src = photoWrap.dataset.image + '?v=' + ASSET_VER;
    }

    function preloadAround(slides, index, radius = PRELOAD_RADIUS) {
      const n = slides.length;
      for (let d = 0; d <= radius; d++) {
        loadSlideImage(slides[(index + d) % n]);
        if (d > 0) loadSlideImage(slides[(index - d + n) % n]);
      }
    }

    function flattenCategories(menu, itemKey = 'drinks') {
      const slides = [];
      for (const cat of menu.categories || []) {
        const items = cat[itemKey] || cat.items || [];
        for (const item of items) {
          slides.push({
            item,
            categoryId: cat.id || '',
            categoryTitle: cat.title,
            kind: itemKey === 'items' ? 'food' : 'drink'
          });
        }
      }
      return slides;
    }

    function isFeaturedEntry(entry) {
      const item = entry.item || {};
      const tags = item.tags || [];
      return (
        item.new === true ||
        entry.categoryId === 'seasonal' ||
        tags.includes('seasonal')
      );
    }

    /** Featured (new/seasonal) first: zip featured drinks with food, then remaining drinks. */
    function orderMenuEntries(drinkEntries, foodEntries) {
      const featuredDrinks = [];
      const restDrinks = [];
      for (const e of drinkEntries) {
        (isFeaturedEntry(e) ? featuredDrinks : restDrinks).push(e);
      }

      const featuredFood = [];
      const restFood = [];
      for (const e of foodEntries) {
        (isFeaturedEntry(e) ? featuredFood : restFood).push(e);
      }

      const foodZip = [...featuredFood, ...restFood];
      const ordered = [];
      const n = Math.max(featuredDrinks.length, foodZip.length);
      for (let i = 0; i < n; i += 1) {
        if (i < featuredDrinks.length) ordered.push(featuredDrinks[i]);
        if (i < foodZip.length) ordered.push(foodZip[i]);
      }
      ordered.push(...restDrinks);
      return ordered;
    }

    function applyFrame(settings) {
      const frame = document.getElementById('frame');
      const progress = document.querySelector('.board__progress');
      const orient = settings.orientation === 'landscape' ? 'landscape' : 'portrait';

      frame.setAttribute('data-orient', orient);

      if (progress && document.documentElement.getAttribute('data-rotate') === 'off') {
        if (orient === 'landscape') {
          progress.style.width = 'min(100vw, calc(100vh * 16 / 9))';
        } else {
          progress.style.width = 'min(100vw, calc(100vh * 9 / 16))';
        }
      } else if (progress) {
        progress.style.width = '';
      }
    }

    function getRotateMode() {
      try {
        const saved = localStorage.getItem(ROTATE_KEY);
        if (saved && ROTATE_MODES.includes(saved)) return saved;
      } catch (e) { /* ignore */ }
      // Android TV / landscape browser + hung portrait monitor
      return window.innerWidth > window.innerHeight ? 'cw' : 'off';
    }

    function setRotateMode(mode) {
      if (!ROTATE_MODES.includes(mode)) mode = 'off';
      document.documentElement.setAttribute('data-rotate', mode);
      try { localStorage.setItem(ROTATE_KEY, mode); } catch (e) { /* ignore */ }

      const btn = document.getElementById('orientBtn');
      if (btn) {
        btn.dataset.mode = mode;
        btn.setAttribute('aria-pressed', mode !== 'off' ? 'true' : 'false');
        btn.title = mode === 'off'
          ? 'Без поворота'
          : mode === 'cw'
            ? 'Поворот 90° (по часовой) — тап сменить'
            : 'Поворот 90° (против часовой) — тап сменить';
      }

      const progress = document.querySelector('.board__progress');
      if (progress) {
        progress.style.width = mode === 'off' ? progress.style.width : '';
      }
    }

    function cycleRotateMode() {
      const cur = document.documentElement.getAttribute('data-rotate') || 'off';
      const next = ROTATE_MODES[(ROTATE_MODES.indexOf(cur) + 1) % ROTATE_MODES.length];
      setRotateMode(next);
      requestAnimationFrame(() => {
        const active = document.querySelector('.slide--active');
        if (active) fitSlideCaptions(active);
      });
    }

    function initOrientControl() {
      setRotateMode(getRotateMode());
      const btn = document.getElementById('orientBtn');
      if (btn) btn.addEventListener('click', cycleRotateMode);
    }

    function fitWidthMax(el, minPx, maxPx) {
      if (!el || el.clientWidth < 8) return minPx;
      el.style.whiteSpace = 'nowrap';
      let lo = minPx;
      let hi = maxPx;
      let best = minPx;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        el.style.fontSize = mid + 'px';
        if (el.scrollWidth <= el.clientWidth + 1) {
          best = mid;
          lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      el.style.fontSize = best + 'px';
      return best;
    }

    function syncBadgeSizes(slide, pricePx) {
      const badgePx = Math.max(11, Math.min(20, Math.round(pricePx * 0.45)));
      slide.querySelectorAll('.slide__discount, .slide__new').forEach((el) => {
        el.style.fontSize = badgePx + 'px';
        el.style.padding = Math.max(4, Math.round(badgePx * 0.35)) + 'px ' +
          Math.max(8, Math.round(badgePx * 0.7)) + 'px';
      });
    }

    function fitPriceInPromo(slide, minPx, maxPx) {
      const price = slide.querySelector('.slide__price');
      const promo = slide.querySelector('.slide__promoRow');
      if (!price || !promo || promo.clientWidth < 8) return minPx;

      let lo = minPx;
      let hi = maxPx;
      let best = minPx;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        price.style.fontSize = mid + 'px';
        syncBadgeSizes(slide, mid);
        const badges = promo.querySelectorAll('.slide__new, .slide__discount');
        let badgeW = 0;
        badges.forEach((b) => { badgeW += b.offsetWidth; });
        const gaps = 8 * Math.max(1, badges.length);
        const avail = Math.max(48, promo.clientWidth - badgeW - gaps);
        if (price.scrollWidth <= avail + 1 && promo.scrollWidth <= promo.clientWidth + 2) {
          best = mid;
          lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      price.style.fontSize = best + 'px';
      syncBadgeSizes(slide, best);
      return best;
    }

    /** Shrink poem type until verse + author fit the body (no mid-line clip / overlap). */
    function fitPoemText(slide) {
      if (!slide || !slide.classList.contains('slide--poem')) return;
      const body = slide.querySelector('.poem-card__body');
      const text = slide.querySelector('.poem__text');
      const author = slide.querySelector('.poem__author');
      const eyebrow = slide.querySelector('.poem__eyebrow');
      if (!body || !text) return;

      const isCf = slide.classList.contains('slide--poem-cf');
      const maxPx = isCf ? 44 : 40;
      const minPx = 26; // TV floor — still readable at 2–4 m

      text.style.fontSize = maxPx + 'px';
      text.style.lineHeight = '';
      body.style.gap = '';
      if (author) {
        author.style.marginTop = '';
        author.style.paddingTop = '';
      }
      if (eyebrow) eyebrow.style.marginBottom = '';

      /** Body scroll overflow, or verse rect colliding with author (flex-shrink overlap). */
      function poemOverflows(minAuthorGap) {
        if (body.scrollHeight > body.clientHeight + 1) return true;
        if (author) {
          const tr = text.getBoundingClientRect();
          const ar = author.getBoundingClientRect();
          if (tr.bottom > ar.top - minAuthorGap + 0.5) return true;
        }
        return false;
      }

      let guard = 120;
      while (guard-- > 0 && poemOverflows(10)) {
        const cur = parseFloat(text.style.fontSize) || maxPx;
        if (cur <= minPx) break;
        text.style.fontSize = cur - 1 + 'px';
      }

      // Still tight at floor: compress line-height / gap, then allow down to 22px
      if (poemOverflows(10)) {
        text.style.lineHeight = '1.14';
        body.style.gap = '10px';
        if (author) author.style.paddingTop = '4px';
        guard = 30;
        while (guard-- > 0 && poemOverflows(6)) {
          const cur = parseFloat(text.style.fontSize) || minPx;
          if (cur <= 22) break;
          text.style.fontSize = cur - 1 + 'px';
        }
      }
    }

    function fitSlideCaptions(slide) {
      if (
        !slide ||
        slide.classList.contains('slide--intro') ||
        slide.classList.contains('slide--promo') ||
        slide.classList.contains('slide--cat')
      ) return;
      if (slide.classList.contains('slide--poem')) {
        fitPoemText(slide);
        return;
      }
      const info = slide.querySelector('.slide__info');
      const name = slide.querySelector('.slide__name');
      const desc = slide.querySelector('.slide__desc');
      const price = slide.querySelector('.slide__price');
      if (!info) return;

      const frame = document.getElementById('frame');
      const frameH = (frame && frame.clientHeight) || window.innerHeight;
      const infoH = info.clientHeight || Math.round(frameH * 0.15);

      const nameMax = Math.round(Math.min(78, Math.max(28, infoH * 0.5)));
      const priceMax = Math.round(Math.min(52, Math.max(20, infoH * 0.32)));
      const descMax = Math.round(Math.min(30, Math.max(13, infoH * 0.24)));

      [name, desc, price].forEach((el) => {
        if (el) el.style.fontSize = '';
      });

      // 1) Maximize each line horizontally (no wrap)
      fitWidthMax(name, 20, nameMax);
      fitPriceInPromo(slide, 16, priceMax);
      fitWidthMax(desc, 12, descMax);

      // 2) Fill leftover vertical space: name → price → desc
      let guard = 120;
      while (guard-- > 0 && info.scrollHeight < info.clientHeight - 2) {
        let grew = false;
        const bump = (el, max, refit) => {
          if (!el) return false;
          const cur = parseFloat(el.style.fontSize) || 0;
          if (cur >= max) return false;
          el.style.fontSize = (cur + 1) + 'px';
          if (refit) refit();
          if (el.scrollWidth > el.clientWidth + 1 || info.scrollHeight > info.clientHeight + 1) {
            el.style.fontSize = cur + 'px';
            if (refit) refit();
            return false;
          }
          return true;
        };
        grew = bump(name, nameMax, null) || grew;
        if (!grew) {
          grew = bump(price, priceMax, () => syncBadgeSizes(slide, parseFloat(price.style.fontSize) || 16)) || grew;
        }
        if (!grew) grew = bump(desc, descMax, null) || grew;
        if (!grew) break;
      }

      // 3) Safety if still overflowing
      guard = 80;
      while (guard-- > 0 && info.scrollHeight > info.clientHeight + 1) {
        const order = [desc, price, name];
        let shrunk = false;
        for (const el of order) {
          if (!el) continue;
          const cur = parseFloat(el.style.fontSize) || 0;
          const floor = el === name ? 18 : el === price ? 16 : 11;
          if (cur <= floor) continue;
          el.style.fontSize = (cur - 1) + 'px';
          if (el === name || el === desc) fitWidthMax(el, floor, cur - 1);
          if (el === price) syncBadgeSizes(slide, cur - 1);
          shrunk = true;
          break;
        }
        if (!shrunk) break;
      }
    }

    function buildSlideSequence(
      intro,
      promo,
      telegram,
      cat,
      classicPoems,
      cfPoems,
      itemSlides,
      everyN = PROMO_EVERY_N_CARDS
    ) {
      // intro → promo → Telegram QR → cat GIF → classic → CF → N cards → …
      const sequence = [intro];
      let classicIdx = 0;
      let cfIdx = 0;
      let i = 0;

      while (i < itemSlides.length) {
        sequence.push(promo);
        if (telegram) sequence.push(telegram);
        if (cat) sequence.push(cat);
        if (classicPoems.length) {
          sequence.push(classicPoems[classicIdx % classicPoems.length]);
          classicIdx += 1;
        }
        if (cfPoems.length) {
          sequence.push(cfPoems[cfIdx % cfPoems.length]);
          cfIdx += 1;
        }
        for (let n = 0; n < everyN && i < itemSlides.length; n += 1, i += 1) {
          sequence.push(itemSlides[i]);
        }
      }

      if (itemSlides.length === 0) {
        sequence.push(promo);
        if (telegram) sequence.push(telegram);
        if (cat) sequence.push(cat);
        const max = Math.max(classicPoems.length, cfPoems.length);
        for (let p = 0; p < max; p += 1) {
          if (p < classicPoems.length) sequence.push(classicPoems[p]);
          if (p < cfPoems.length) sequence.push(cfPoems[p]);
        }
      }

      return sequence;
    }

    function slideDurationSec(slide, defaultSec, classicSec, cfSec, tgSec, catSec) {
      if (!slide) return defaultSec;
      if (slide.classList.contains('slide--tg')) return tgSec;
      if (slide.classList.contains('slide--cat')) return catSec;
      if (slide.classList.contains('slide--poem-cf')) return cfSec;
      if (slide.classList.contains('slide--poem')) return classicSec;
      return defaultSec;
    }

    function runSlideshow(sequence, durationSec, classicSec, cfSec, tgSec, catSec) {
      const bar = document.getElementById('progress');
      const uniqueSlides = [...new Set(sequence)];
      let index = 0;
      let timer = null;

      function clearTimer() {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
      }

      function show(i) {
        const active = sequence[i];
        const dur = slideDurationSec(active, durationSec, classicSec, cfSec, tgSec, catSec);
        uniqueSlides.forEach((s) => s.classList.toggle('slide--active', s === active));
        syncPromoFallDistance(active);
        startPromoPctBoom(active);
        if (active.classList.contains('slide--tg')) {
          startTgQrAssemble(active);
        } else {
          uniqueSlides.forEach((s) => {
            if (s.classList.contains('slide--tg')) resetTgQrAssemble(s);
          });
        }
        const uniqueIndex = uniqueSlides.indexOf(active);
        preloadAround(uniqueSlides, Math.max(0, uniqueIndex));
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            fitSlideCaptions(active);
            fitPoemText(active);
          });
        });

        bar.style.transition = 'none';
        bar.style.width = '0%';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            bar.style.transition = `width ${dur}s linear`;
            bar.style.width = '100%';
          });
        });
      }

      function scheduleNext() {
        clearTimer();
        const active = sequence[index];
        const dur = slideDurationSec(active, durationSec, classicSec, cfSec, tgSec, catSec);
        timer = setTimeout(() => {
          index = (index + 1) % sequence.length;
          show(index);
          scheduleNext();
        }, dur * 1000);
      }

      show(0);
      scheduleNext();

      window.addEventListener('resize', () => {
        syncPromoFallDistance(sequence[index]);
        fitSlideCaptions(sequence[index]);
        fitPoemText(sequence[index]);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearTimer();
        } else if (!timer) {
          show(index);
          scheduleNext();
        }
      });
    }

    async function init() {
      try {
        initOrientControl();
        const { drinks, food, poems } = await loadMenuData();
        applyFrame(drinks.settings);

        const frame = document.getElementById('frame');
        const drinkEntries = flattenCategories(drinks, 'drinks');
        const foodEntries = flattenCategories(food, 'items');
        const orderedEntries = orderMenuEntries(drinkEntries, foodEntries);
        const itemSlides = orderedEntries.map((e) =>
          createItemSlide(e.item, e.categoryTitle, drinks.brand, e.kind)
        );

        const intro = createIntroSlide(drinks.brand);
        const promo = createPersonalDiscountSlide(drinks.brand);
        const telegram = createTelegramOrderSlide(drinks.brand);
        /* Temporarily off rotation — createCatSlide + assets/images/cat/barista-spin.gif kept */
        const cat = null;

        const classicList = Array.isArray(poems.classic)
          ? poems.classic
          : Array.isArray(poems.poems)
            ? poems.poems.filter((p) => p.author !== 'CoffeeFriends')
            : [];
        const cfList = Array.isArray(poems.coffeeFriends)
          ? poems.coffeeFriends
          : Array.isArray(poems.poems)
            ? poems.poems.filter((p) => p.author === 'CoffeeFriends')
            : [];

        const classicPoems = classicList.map((p) =>
          createPoemSlide(p, drinks.brand, {
            eyebrow: poems.eyebrowClassic || 'Осень',
            variant: 'classic',
            badge: 'Стих'
          })
        );
        const cfPoems = cfList.map((p) =>
          createPoemSlide(p, drinks.brand, {
            eyebrow: poems.eyebrowCf || 'CoffeeFriends',
            variant: 'cf',
            badge: 'Наше'
          })
        );

        const classicSec = Number(poems.classicDurationSec) || POEM_CLASSIC_DURATION_SEC;
        const cfSec = Number(poems.cfDurationSec) || POEM_CF_DURATION_SEC;
        const tgSec = Math.max(
          Number(poems.tgOrderDurationSec) || 0,
          TG_ORDER_DURATION_SEC
        );
        const catSec = Number(poems.catDurationSec) || CAT_SLIDE_DURATION_SEC;
        const sequence = buildSlideSequence(
          intro,
          promo,
          telegram,
          cat,
          classicPoems,
          cfPoems,
          itemSlides,
          PROMO_EVERY_N_CARDS
        );

        [intro, promo, telegram, ...classicPoems, ...cfPoems, ...itemSlides].forEach((s) =>
          frame.appendChild(s)
        );
        syncPromoFallDistance(promo);
        syncPromoFallDistance(telegram);
        runSlideshow(
          sequence,
          drinks.settings.slideDurationSec || 3.5,
          classicSec,
          cfSec,
          tgSec,
          catSec
        );
      } catch (err) {
        document.body.innerHTML = `<pre style="color:#c9b067;padding:2rem;font-family:monospace">${err.message}\n\nЗапуск:\ncd d:\\projects\\MarketingCofe\\menu\npython -m http.server 8080\n\n→ http://localhost:8080/board.html</pre>`;
      }
    }
